<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <filter id="lockShadow" x="180" y="100" width="664" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="44" stdDeviation="38" flood-color="#ff3b30" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Keep the canvas opaque for unmasked renderers while retaining the rounded
       app-icon face. The black corner fill prevents browsers from showing white. -->
